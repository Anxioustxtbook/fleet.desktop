/* ===== v2: Airbnb-style splash, count-up, smooth transitions ===== */
@property --r{syntax:'<length>';initial-value:0px;inherits:false}
:root{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Roboto,"Segoe UI","Helvetica Neue",Arial,sans-serif}
#splash{transition:none;--r:0px;-webkit-mask:radial-gradient(circle at 50% 90%,transparent var(--r),#000 calc(var(--r) + 1px));mask:radial-gradient(circle at 50% 90%,transparent var(--r),#000 calc(var(--r) + 1px))}
#splash img{opacity:0;transform:scale(.8);animation:pop .9s cubic-bezier(.2,.8,.2,1) .25s forwards}
#splash .sb{animation:rise .8s ease 1.1s forwards}#splash .sb i{letter-spacing:.3em}
#splash.out{animation:reveal .95s cubic-bezier(.65,0,.35,1) forwards}
@keyframes reveal{to{--r:1200px}}
@keyframes pop{to{opacity:1;transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#scr.in>*{opacity:0;animation:rise .42s cubic-bezier(.2,.8,.2,1) forwards}
#scr.in>*:nth-child(2){animation-delay:.05s}#scr.in>*:nth-child(3){animation-delay:.1s}#scr.in>*:nth-child(4){animation-delay:.15s}#scr.in>*:nth-child(5){animation-delay:.2s}#scr.in>*:nth-child(6){animation-delay:.25s}#scr.in>*:nth-child(n+7){animation-delay:.3s}
#pg.open{animation:slin .34s cubic-bezier(.2,.8,.2,1)}#pg.closing{animation:slout .2s ease forwards}
@keyframes slin{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes slout{to{transform:translateX(36px);opacity:0}}
#ov.open{animation:fi0 .25s ease}#ov.open #sh{animation:up .38s cubic-bezier(.2,.9,.25,1)}
@keyframes fi0{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.tb.on svg{animation:tpop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes tpop{from{transform:scale(.7)}to{transform:none}}

/* ===== v3: swipe + vehicle photos ===== */
#scr,#pg{touch-action:pan-y}
.vph{padding:0;overflow:hidden}.vph img{display:block;width:100%;height:190px;object-fit:cover}
.vph .ph0{height:120px;display:grid;place-items:center;color:var(--dim);font-size:14px;background:var(--card2)}
.vph .vb{display:flex;gap:10px;padding:12px}.vph .vb button{flex:1;min-height:48px;border-radius:14px;font-weight:700;background:var(--card2);color:var(--ink)}
.vph .vb button.go{background:var(--gold);color:var(--onfab)}
.vth{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none}
.bnr{width:100%;height:150px;object-fit:cover;border-radius:18px;margin-bottom:12px;display:block}

/* ===== Splash: diagonal logo trace/reveal ===== */
#splash img{opacity:1;transform:none;clip-path:polygon(0 100%,0 100%,0 100%,0 100%);animation:logoTrace .95s cubic-bezier(.2,.75,.25,1) .12s forwards}
@keyframes logoTrace{0%{clip-path:polygon(0 100%,0 100%,0 100%,0 100%);transform:scale(.94)}55%{clip-path:polygon(0 100%,100% 0,100% 0,0 100%);transform:scale(.98)}100%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:scale(1)}}
#splash .sb{animation:rise .5s ease .95s forwards}
#splash.out{animation:reveal .85s cubic-bezier(.65,0,.35,1) forwards}

#splash .lg{position:relative;isolation:isolate;display:block;line-height:0}
#splash img{opacity:0;clip-path:none;transform:scale(.85);animation:pop .5s cubic-bezier(.2,.8,.2,1) .05s forwards}
#ov.circ{animation:circ .75s cubic-bezier(.45,.05,.35,1)}#ov.circ #sh{animation:none}
@keyframes circ{from{clip-path:circle(0px at var(--ox) var(--oy))}to{clip-path:circle(1100px at var(--ox) var(--oy))}}
.hero.tap:not(.img){background:linear-gradient(90deg,#0c1016 30%,rgba(12,16,22,0) 70%),var(--logo) right 6px center/auto 94% no-repeat,#000;border-color:#1c222b}.hero:not(.img) .more{background:rgba(0,0,0,.6);padding:4px 9px;border-radius:10px}
.hero:not(.img) svg.car{display:none}
.tw tr.tot td{font-weight:800;border-top:2px solid var(--line);background:var(--card2)}
.mrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.mrow .chip{flex:none}
.vatb{margin:0 0 10px;font-size:13.5px;line-height:1.5}
#splash img.gl{position:absolute;left:0;top:0;opacity:1;transform:none;filter:brightness(2.6) saturate(.45);clip-path:polygon(-30% 0,-10% 0,-30% 100%,-50% 100%);animation:band .95s ease-in-out .6s both}
@keyframes band{from{clip-path:polygon(-30% 0,-10% 0,-30% 100%,-50% 100%)}to{clip-path:polygon(115% 0,135% 0,115% 100%,95% 100%)}}

/* ===== v6 ===== */
#splash .sb b{letter-spacing:.1em;font-size:13px}#splash .sb i{letter-spacing:.16em}
.hello{cursor:default;padding:0;border-radius:0}.hello .who{display:flex;align-items:center;gap:12px;cursor:pointer}.hello .pill{margin-left:auto;cursor:pointer}
.av{overflow:hidden;object-fit:cover}img.av{display:block}
#scr{overscroll-behavior-y:contain}
@keyframes rise2{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#scr.in>*{animation:rise2 .26s cubic-bezier(.2,.8,.2,1) both}
#scr.in>*:nth-child(2){animation-delay:.03s}#scr.in>*:nth-child(3){animation-delay:.06s}#scr.in>*:nth-child(4){animation-delay:.09s}#scr.in>*:nth-child(5){animation-delay:.12s}#scr.in>*:nth-child(6){animation-delay:.15s}#scr.in>*:nth-child(n+7){animation-delay:.18s}
#pg,#sh{will-change:transform,opacity}#pg.open{animation-duration:.22s}#pg.closing{animation-duration:.15s}#ov.open{animation-duration:.18s}#ov.open #sh{animation-duration:.26s}#ov.circ{animation-duration:.5s}
#sh.addsh{touch-action:none}#sh.tall{height:82%;transition:height .25s cubic-bezier(.2,.8,.2,1)}
.nthint{text-align:center;color:var(--dim);font-size:12.5px;padding:6px 0 14px}.nthint:before{content:'';display:block;width:34px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 8px}
.nb{display:none;padding:0 18px 18px;flex:1;min-height:0}#sh.tall .nb{display:flex;flex-direction:column;gap:8px}#sh.tall .nthint{display:none}
.nb textarea{flex:1;min-height:140px;width:100%;border:1px solid var(--line);border-radius:16px;background:var(--card2);color:var(--ink);padding:14px;font:inherit;font-size:16px;resize:none;touch-action:auto}
#sh.pks{height:78%}#sh.pks .shb{display:flex;flex-direction:column;flex:1;min-height:0}#sh.pks #pkl{flex:1;min-height:0;overflow-y:auto}
#fadd{position:absolute;z-index:38;width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--onfab);display:none;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.28);touch-action:none;cursor:grab;border:0}
#fadd:active{cursor:grabbing;transform:scale(1.06)}
#ptr{position:absolute;left:50%;top:64px;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--goldt);z-index:20;opacity:0;pointer-events:none;transform:translate(-50%,-44px)}
#ptr.spin svg{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* ===== v7 ===== */
.fld{position:relative}.sgl{position:absolute;left:0;right:0;top:calc(100% - 2px);z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sgl div{padding:12px 14px;font-size:15px;border-bottom:1px solid var(--line)}.sgl div:last-child{border:0}.sgl div:active{background:var(--card2)}
.pbar{height:10px;border-radius:10px;background:var(--card2);overflow:hidden;margin-top:10px}.pbar i{display:block;height:100%;background:var(--gold);border-radius:10px;animation:grow .9s .15s both cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.rb .row{padding:12px 14px}.rb .x{font-size:12.5px;color:var(--dim);margin-top:2px}

/* ===== v8 ===== */
.hdb{display:flex;align-items:center;gap:10px}.vbtn{height:44px;padding:0 14px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;color:var(--ink)}
.pb:has(.jfoot){display:flex;flex-direction:column}.jfoot{text-align:center;margin:28px 0 10px auto;padding-top:24px;width:100%}.jfoot b{display:block;font-size:22px;letter-spacing:.2em;color:var(--goldt);font-weight:800}.jfoot span{font-size:12.5px;color:var(--dim)}

/* ===== v9: notifications + alerts ===== */
.bellb{position:relative;margin-left:auto;width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex:none}
.hello .bellb+.pill{margin-left:10px}
.nb9{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font:800 11.5px/20px var(--font);text-align:center;border:2px solid var(--bg);box-sizing:content-box}
.alc{display:flex;align-items:center;gap:14px;margin:14px 0 0;padding:16px;border-radius:22px;background:var(--redbg);border:1px solid rgba(214,69,65,.35);cursor:pointer}
.alc .ico{position:relative;width:48px;height:48px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.alc .ico .nb9{top:-9px;right:-9px;border-color:var(--bg);background:#fff;color:var(--red);box-shadow:0 0 0 2px var(--red)}
.alc .t{flex:1;min-width:0}.alc b{display:block;font-size:17px;color:var(--ink)}.alc span.s{display:block;color:var(--dim);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alc .pulse{position:absolute;inset:0;border-radius:16px;box-shadow:0 0 0 0 rgba(214,69,65,.55);animation:pls 2s infinite}
@keyframes pls{70%{box-shadow:0 0 0 12px rgba(214,69,65,0)}100%{box-shadow:0 0 0 0 rgba(214,69,65,0)}}
.cnt{min-width:26px;height:26px;border-radius:13px;background:var(--red);color:#fff;font:800 13px/26px var(--font);text-align:center;padding:0 7px;flex:none}
.cnt.o{background:var(--orange)}.cnt.b{background:var(--blue)}
.nrow{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}.nrow:last-child{border:0}
.nrow .ci{margin-top:2px}.nrow .t{font-size:15.5px;font-weight:600;line-height:1.3}.nrow.un .t{font-weight:800}.nrow .s{color:var(--dim);font-size:13.5px;margin-top:2px;line-height:1.35}.nrow .tm{color:var(--dim);font-size:12px;white-space:nowrap;margin-top:3px}
.nrow.un:before{content:'';position:absolute;left:5px;top:50%;width:7px;height:7px;margin-top:-3px;border-radius:50%;background:var(--gold)}
.swt{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}.swt:after{content:'';position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0004;transition:transform .2s}.swt.on{background:var(--green)}.swt.on:after{transform:translateX(20px)}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}.srow:last-child{border:0}.srow .m{flex:1;min-width:0}.srow .t{font-size:15.5px;font-weight:600}.srow .s{font-size:13px;color:var(--dim);margin-top:2px}
#push{position:absolute;left:10px;right:10px;top:10px;z-index:90;display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:22px;background:rgba(28,32,38,.94);color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,.9,.25,1);cursor:pointer}
#push.show{transform:none}
#push .lg9{width:38px;height:38px;border-radius:10px;background:#000 var(--logo) center/cover;flex:none;border:1px solid #333}
#push small{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.06em;color:#aab3bf;font-weight:700;text-transform:uppercase}
#push b{display:block;font-size:15px;margin-top:2px}#push span.d{display:block;font-size:13.5px;color:#d3d8de;margin-top:1px;line-height:1.3}

/* ===== v10 ===== */
.aico{position:relative;width:48px;height:48px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.aico .nb9{top:-9px;right:-9px;background:#fff;color:var(--red);border-color:var(--bg);box-shadow:0 0 0 2px var(--red)}
.tile{position:relative}.tile .nb9{top:4px;right:calc(50% - 34px);border-color:var(--card2)}
.trh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
.trh .mo{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}.trh .mo i{font-style:normal;color:var(--orange);letter-spacing:.04em;text-transform:none;margin-left:6px}
.trv{display:flex;gap:18px;margin:4px 0 10px}.trv div small{display:block;font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:600}.trv div b{font:700 16.5px var(--mono)}

let JIRANI_SAVE_BTN=null,JIRANI_SAVE_HTML='',JIRANI_SAVE_OK=false;

document.addEventListener('click',e=>{

 if(!b||!(/sv\s*\(/.test(b.getAttribute('onclick')||'')))return;

 setTimeout(()=>{if(JIRANI_SAVE_BTN===b&&!JIRANI_SAVE_OK)jiraniRestoreSave()},1800);

 if(/^Saved(?:\.|$)/.test(String(m))){

 }
 _toastJirani(m);
};
